# ─────────────────────────────────────────────────────────────────────────────
# Kylrix — App-Only Override
# Use this if you already have Appwrite running externally.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.app-only.yml up -d
#   — or —
#   make app-only
# ─────────────────────────────────────────────────────────────────────────────

services:
  kylrix:
    build:
      args:
        - NEXT_PUBLIC_APPWRITE_ENDPOINT=${NEXT_PUBLIC_APPWRITE_ENDPOINT:?Set NEXT_PUBLIC_APPWRITE_ENDPOINT in .env}
        - NEXT_PUBLIC_APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID:?Set APPWRITE_PROJECT_ID in .env}
        - NEXT_PUBLIC_DOMAIN=${DOMAIN:-localhost}
    depends_on: {}
    ports:
      - "${APP_PORT:-5003}:3000"

  appwrite:
    profiles: ["disabled"]
  mariadb:
    profiles: ["disabled"]
  redis:
    profiles: ["disabled"]
  caddy:
    profiles: ["disabled"]
