# ─────────────────────────────────────────────────────────────────────────────
# Kylrix — App-Only Override
# Use this when connecting to Turso Cloud (libsql://...) or an existing external libSQL server.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.app-only.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  kylrix:
    depends_on: {}
    ports:
      - "${APP_PORT:-5003}:3000"

  turso:
    profiles: ["disabled"]
  caddy:
    profiles: ["disabled"]
