# ─────────────────────────────────────────────────────────────────────────────
# Kylrix — Self-Hosting Stack
# ─────────────────────────────────────────────────────────────────────────────

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ── Kylrix — The Next.js application ──────────────────────────────────────
  kylrix:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APPWRITE_ENDPOINT=${NEXT_PUBLIC_APPWRITE_ENDPOINT:-https://api.kylrix.space/v1}
        - NEXT_PUBLIC_APPWRITE_PROJECT_ID=${NEXT_PUBLIC_APPWRITE_PROJECT_ID:-67fe9627001d97e37ef3}
        - NEXT_PUBLIC_DOMAIN=${DOMAIN:-localhost}
    container_name: kylrix-app
    <<: *common
    ports:
      - "${APP_PORT:-3006}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APPWRITE_ENDPOINT=${NEXT_PUBLIC_APPWRITE_ENDPOINT:-https://api.kylrix.space/v1}
      - NEXT_PUBLIC_APPWRITE_PROJECT_ID=${NEXT_PUBLIC_APPWRITE_PROJECT_ID:-67fe9627001d97e37ef3}
      - NEXT_PUBLIC_DOMAIN=${DOMAIN:-localhost}
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.request({hostname:'127.0.0.1',port:3000,path:'/api/health',timeout:3000},res=>{process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.end()"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - kylrix-net

# ── Network ──────────────────────────────────────────────────────────────────
networks:
  kylrix-net:
    driver: bridge
