# ─────────────────────────────────────────────────────────────────────────────
# Kylrix — Modern Self-Hosting Stack
# Includes: Kylrix App + Turso libSQL Server (sqld) (+ optional Caddy HTTPS)
#
# Ultra-lightweight: ~80MB RAM total, <2s boot, zero BaaS bloat.
#
# Usage:
#   ./selfhost.sh
#   — or —
#   docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ── Kylrix — Next.js Application ──────────────────────────────────────────
  kylrix:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_DOMAIN=${DOMAIN:-localhost}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:5003}
        - NEXT_PUBLIC_DATABASE_PROVIDER=turso
    container_name: kylrix-app
    <<: *common
    ports:
      - "${APP_PORT:-5003}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - SELFHOSTED=true
      - NEXT_PUBLIC_DATABASE_PROVIDER=turso
      - TURSO_DATABASE_URL=${TURSO_DATABASE_URL:-http://turso:8080}
      - TURSO_AUTH_TOKEN=${TURSO_AUTH_TOKEN:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:5003}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:5003}
      - NEXT_PUBLIC_DOMAIN=${DOMAIN:-localhost}
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.request({hostname:'127.0.0.1',port:3000,path:'/api/health',timeout:3000},res=>{process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.end()"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      turso:
        condition: service_healthy
    networks:
      - kylrix-net

  # ── Turso — Open-Source libSQL Server (sqld) ──────────────────────────────
  turso:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: kylrix-turso
    <<: *common
    ports:
      - "${TURSO_PORT:-8080}:8080"
    volumes:
      - turso_data:/var/lib/sqld
    environment:
      - SQLD_DB_PATH=/var/lib/sqld/kylrix.db
      - SQLD_HTTP_LISTEN_ADDR=0.0.0.0:8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    networks:
      - kylrix-net

  # ── Caddy — Optional HTTPS reverse proxy (production domains) ─────────────
  caddy:
    profiles: ["production"]
    image: caddy:2-alpine
    container_name: kylrix-caddy
    <<: *common
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    depends_on:
      kylrix:
        condition: service_healthy
    networks:
      - kylrix-net

volumes:
  turso_data:
  caddy_data:
  caddy_config:

networks:
  kylrix-net:
    driver: bridge
